[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-equity-research-report-generator"
version = "0.1.0"
description = "Generate structured equity research reports from market data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2.54",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "tabulate>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
